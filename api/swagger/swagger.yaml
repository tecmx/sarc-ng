      - application/json
      description: Retrieve a paginated list of all buildings with support for search,
        filtering, and sorting
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 'Page size (default: 20, max: 100)'
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: Search across name and code fields
        in: query
        name: search
        type: string
      - description: Filter by exact name match
        in: query
        name: filter[name]
        type: string
      - description: Filter by exact code match
        in: query
        name: filter[code]
        type: string
      - description: Sort field (id, name, code, created_at, updated_at)
        in: query
        name: sort
        type: string
      - default: asc
        description: Sort order (asc or desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of buildings
          schema:
            $ref: '#/definitions/sarc-ng_internal_transport_common.PaginatedResponse-internal_transport_rest_building_BuildingDTO'
        "400":
          description: Invalid filter or sort field
